<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Showcase | Self-Service Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root { --glass: rgba(255, 255, 255, 0.08); --accent: #ffffff; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #0a0a0a; color: white; display: flex; height: 100vh; overflow: hidden; }

        /* SLEEK SIDEBAR - Glassmorphism style */
        #sidebar { 
            width: 320px; background: var(--glass); backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1); padding: 30px; 
            display: flex; flex-direction: column; z-index: 10;
        }

        #viewer-container { flex-grow: 1; position: relative; background: #000; }
        
        model-viewer { 
            width: 100%; height: 100%; 
            --progress-bar-color: #fff;
        }

        /* PREMIUM BUTTONS */
        .file-label {
            border: 1px solid #fff; padding: 12px; text-align: center;
            border-radius: 2px; font-size: 11px; letter-spacing: 2px;
            cursor: pointer; transition: all 0.3s; margin-bottom: 30px;
        }
        .file-label:hover { background: #fff; color: #000; }

        .view-btn {
            background: none; border: 1px solid rgba(255,255,255,0.2); color: #ccc;
            padding: 10px; margin-bottom: 8px; text-align: left; cursor: pointer;
            font-size: 12px; transition: 0.2s;
        }
        .view-btn:hover { border-color: #fff; color: #fff; }

        h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: #666; margin: 25px 0 10px; }
        
        .control-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 12px; }
        input[type="range"] { width: 100px; accent-color: #fff; }

        #file-input { display: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <label class="file-label" for="file-input">IMPORT PROJECT</label>
    <input type="file" id="file-input" accept=".glb">

    <h4>Scene Views</h4>
    <button class="view-btn" onclick="setCamera('0deg 75deg 105%', '0m 0m 0m')">Perspective View</button>
    <button class="view-btn" onclick="setCamera('0deg 0deg 100%', '0m 0m 0m')">Top Down</button>
    <button class="view-btn" onclick="setCamera('90deg 90deg 100%', '0m 0m 0m')">Side Elevation</button>

    <h4>Visibility</h4>
    <div class="control-row">Ceiling <input type="checkbox" checked id="toggle-Ceiling"></div>
    <div class="control-row">Walls <input type="checkbox" checked id="toggle-Walls"></div>
    <div class="control-row">Furniture <input type="checkbox" checked id="toggle-Furniture"></div>

    <h4>Environment</h4>
    <div class="control-row">Exposure <input type="range" id="input-exposure" min="0" max="2" step="0.05" value="1"></div>
    <div class="control-row">Shadows <input type="range" id="input-shadow" min="0" max="2" step="0.05" value="1"></div>
    <div class="control-row">Auto-Rotate <input type="checkbox" id="check-rotate"></div>
</div>

<div id="viewer-container">
    <model-viewer 
        id="main-viewer" 
        camera-controls 
        interaction-prompt="none"
        shadow-intensity="1" 
        exposure="1"
        environment-image="neutral"
        src="">
    </model-viewer>
</div>

<script type="module">
    const mv = document.querySelector('#main-viewer');

    // Camera Navigation Function
    window.setCamera = (orbit, target) => {
        mv.cameraOrbit = orbit;
        mv.cameraTarget = target;
    };

    // Lighting Controls
    document.getElementById('input-exposure').oninput = (e) => mv.exposure = e.target.value;
    document.getElementById('input-shadow').oninput = (e) => mv.shadowIntensity = e.target.value;
    document.getElementById('check-rotate').onchange = (e) => mv.autoRotate = e.target.checked;

    // File Loading
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            mv.src = URL.createObjectURL(file);
            // Dynamic fly-in effect on load
            mv.addEventListener('load', () => {
                setCamera('45deg 75deg 120%', 'auto auto auto');
            }, { once: true });
        }
    };

    // Layer Toggles
    const updateLayers = () => {
        if (!mv.model) return;
        const layers = {
            Ceiling: document.getElementById('toggle-Ceiling').checked,
            Walls: document.getElementById('toggle-Walls').checked,
            Furniture: document.getElementById('toggle-Furniture').checked
        };
        mv.model.nodes.forEach(node => {
            Object.keys(layers).forEach(key => {
                if (node.name.toLowerCase().includes(key.toLowerCase())) {
                    node.visible = layers[key];
                }
            });
        });
    };

    ['Ceiling', 'Walls', 'Furniture'].forEach(id => {
        document.getElementById(`toggle-${id}`).onchange = updateLayers;
    });

    mv.addEventListener('load', updateLayers);
</script>

</body>
</html>
