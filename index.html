<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JH Professional 3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; background: #121212; color: white; overflow: hidden; 
            display: flex; flex-direction: column; height: 100vh; 
        }

        /* Top Controls Bar */
        #controls { 
            padding: 10px 20px; background: #1e1e1e; border-bottom: 1px solid #333; 
            display: flex; flex-wrap: wrap; gap: 20px; align-items: center; z-index: 10;
        }

        #viewer-container { flex-grow: 1; background: radial-gradient(#2c2c2c, #000); position: relative; }

        model-viewer { width: 100%; height: 100%; filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.1)); }

        /* Control Groups */
        .control-group { 
            display: flex; gap: 12px; background: #2a2a2a; padding: 8px 15px; 
            border-radius: 8px; border: 1px solid #444; align-items: center;
        }

        .group-label { font-size: 10px; color: #888; text-transform: uppercase; margin-right: 5px; font-weight: bold; }

        label { font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        /* Slider Styling */
        input[type="range"] { cursor: pointer; width: 80px; accent-color: #007bff; }

        .file-label {
            background: #007bff; padding: 8px 16px; border-radius: 6px; 
            font-size: 12px; font-weight: bold; cursor: pointer;
        }
        #file-input { display: none; }
    </style>
</head>
<body>

<div id="controls">
    <label class="file-label" for="file-input">OPEN .GLB</label>
    <input type="file" id="file-input" accept=".glb">
    
    <!-- Visibility Controls -->
    <div class="control-group">
        <span class="group-label">Layers</span>
        <label><input type="checkbox" checked id="toggle-Ceiling"> Ceiling</label>
        <label><input type="checkbox" checked id="toggle-Walls"> Walls</label>
        <label><input type="checkbox" checked id="toggle-Furniture"> Furniture</label>
        <label><input type="checkbox" checked id="toggle-Others"> Others</label>
    </div>

    <!-- Lighting & Display Controls -->
    <div class="control-group">
        <span class="group-label">Lighting</span>
        <label>Brightness
            <input type="range" id="input-exposure" min="0" max="2" step="0.1" value="1">
        </label>
        <label>Shadows
            <input type="range" id="input-shadow" min="0" max="2" step="0.1" value="1">
        </label>
    </div>
</div>

<div id="viewer-container">
    <model-viewer 
        id="main-viewer" 
        camera-controls 
        shadow-intensity="1" 
        shadow-softness="1"
        exposure="1"
        environment-image="neutral"
        src="">
    </model-viewer>
</div>

<script type="module">
    const mv = document.querySelector('#main-viewer');
    const exposureSlider = document.getElementById('input-exposure');
    const shadowSlider = document.getElementById('input-shadow');
    const keywords = ['Ceiling', 'Walls', 'Furniture'];

    // --- LIGHTING CONTROL LOGIC ---
    exposureSlider.addEventListener('input', (e) => {
        mv.exposure = e.target.value;
    });

    shadowSlider.addEventListener('input', (e) => {
        mv.shadowIntensity = e.target.value;
    });

    // --- FILE LOADING ---
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) mv.src = URL.createObjectURL(file);
    };

    // --- VISIBILITY LOGIC ---
    const updateVisibility = () => {
        const model = mv.model;
        if (!model) return;

        const states = {
            Ceiling: document.getElementById('toggle-Ceiling').checked,
            Walls: document.getElementById('toggle-Walls').checked,
            Furniture: document.getElementById('toggle-Furniture').checked,
            Others: document.getElementById('toggle-Others').checked
        };

        model.nodes.forEach(node => {
            let matched = false;
            keywords.forEach(key => {
                if (node.name.toLowerCase().includes(key.toLowerCase())) {
                    node.visible = states[key];
                    matched = true;
                }
            });
            if (!matched) node.visible = states.Others;
        });
    };

    // Events
    ['Ceiling', 'Walls', 'Furniture', 'Others'].forEach(id => {
        document.getElementById(`toggle-${id}`).addEventListener('change', updateVisibility);
    });

    mv.addEventListener('load', updateVisibility);
</script>

</body>
</html>
