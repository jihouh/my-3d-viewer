<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: white; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        #viewer-container { flex-grow: 1; position: relative; }
        model-viewer { width: 100%; height: 100%; }

        /* Floating Controls */
        .overlay-ui { position: absolute; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; border: 1px solid #444; max-width: 200px; }
        .overlay-ui h4 { margin: 0 0 10px 0; color: #007bff; }
        .layer-toggle { display: flex; align-items: center; margin-bottom: 8px; font-size: 14px; cursor: pointer; }
        .layer-toggle input { margin-right: 10px; }

        .measurement-info { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: #007bff; padding: 10px 20px; border-radius: 30px; font-weight: bold; display: none; }
        
        .btn { background: #333; color: white; border: 1px solid #555; padding: 5px 10px; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="viewer-container">
        <!-- Overlay UI for Wall/Ceiling Control -->
        <div class="overlay-ui">
            <h4>Visibility Control</h4>
            <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('Ceiling', this.checked)"> Ceiling</label>
            <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('Walls', this.checked)"> All Walls</label>
            <label class="layer-toggle"><input type="checkbox" checked onchange="toggleLayer('Furniture', this.checked)"> Furniture</label>
            <hr style="border:0; border-top:1px solid #444">
            <p style="font-size: 11px; color: #aaa;">Note: Parts must be named in SketchUp to toggle.</p>
            <button class="btn" onclick="location.reload()">Reset View</button>
        </div>

        <div id="measure-label" class="measurement-info">Distance: <span id="dist-val">0</span>m</div>

        <model-viewer id="main-viewer" 
            camera-controls 
            ar 
            shadow-intensity="1" 
            src="YOUR_UPLOADED_MODEL_URL_HERE">
        </model-viewer>
    </div>
</div>

<script type="module">
    const modelViewer = document.querySelector('#main-viewer');

    // --- VISIBILITY LOGIC ---
    window.toggleLayer = (name, isVisible) => {
        const scene = modelViewer.model.symbols; // Access internal Three.js scene
        
        // Loop through all objects in the model
        modelViewer.querySelectorAll('*').forEach((child) => {
            // This is a simplified version. For glTF, we use the 'mesh' name.
        });

        const model = modelViewer.model;
        if (!model) return;

        // Find nodes that contain the string name (e.g., "Ceiling")
        model.materials.forEach((material) => {
            // We can toggle by material or by mesh name
            // Note: Best practice is naming groups in SketchUp before exporting to GLB
        });

        // Advanced: Directly hide meshes by name
        const nd = modelViewer.model.nodes;
        for (const node in nd) {
            if (node.includes(name)) {
                nd[node].visible = isVisible;
            }
        }
    };

    // --- MEASUREMENT LOGIC ---
    // model-viewer doesn't have a ruler tool, but we can use 'hotspots' to simulate it
    let points = [];
    modelViewer.addEventListener('click', (event) => {
        if (!event.shiftKey) return; // Only measure if holding Shift (or add a toggle button)

        const rect = modelViewer.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        
        const hit = modelViewer.positionAndNormalFromPoint(x, y);
        if (hit) {
            points.push(hit.position);
            if (points.length === 2) {
                const d = Math.sqrt(
                    Math.pow(points[0].x - points[1].x, 2) +
                    Math.pow(points[0].y - points[1].y, 2) +
                    Math.pow(points[0].z - points[1].z, 2)
                );
                document.getElementById('measure-label').style.display = 'block';
                document.getElementById('dist-val').innerText = d.toFixed(2);
                points = []; // Reset for next measurement
            }
        }
    });
</script>

</body>
</html>
