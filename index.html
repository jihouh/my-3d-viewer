<!-- Add this to your .overlay-ui section -->
<label class="layer-toggle">Others <input type="checkbox" checked id="toggle-Others"></label>

<script type="module">
    // ... (Keep your existing Firebase imports and config)

    const modelViewer = document.querySelector('#main-viewer');
    
    // We'll store references to help with the "Others" logic
    const primaryLayers = ['Ceiling', 'Walls', 'Furniture'];

    const setupToggles = () => {
        // Add "Others" to the loop
        [...primaryLayers, 'Others'].forEach(layerName => {
            const checkbox = document.getElementById(`toggle-${layerName}`);
            
            checkbox.addEventListener('change', (e) => {
                const isVisible = e.target.checked;
                const model = modelViewer.model;
                if (!model) return;

                for (const node of model.nodes) {
                    if (layerName === 'Others') {
                        // "Others" logic: Hide if it DOES NOT match any primary layer name
                        const isPrimary = primaryLayers.some(p => node.name.includes(p));
                        if (!isPrimary) {
                            node.visible = isVisible;
                        }
                    } else {
                        // Standard logic: Hide if name matches
                        if (node.name.includes(layerName)) {
                            node.visible = isVisible;
                        }
                    }
                }
            });
        });
    };

    // Trigger this when the model finishes loading
    modelViewer.addEventListener('load', setupToggles);
</script>
