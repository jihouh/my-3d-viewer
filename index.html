<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local 3D Viewer</title>
    <!-- Load the 3D viewer component from Google's CDN -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f0f0; display: flex; flex-direction: column; height: 100vh; }
        #controls { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; display: flex; gap: 20px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #viewer-container { flex-grow: 1; position: relative; }
        model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
        .toggle-group { display: flex; gap: 15px; background: #eee; padding: 8px 15px; border-radius: 20px; }
        label { font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        input[type="file"] { font-size: 14px; }
    </style>
</head>
<body>

<div id="controls">
    <!-- Local file picker -->
    <input type="file" id="file-input" accept=".glb">
    
    <div class="toggle-group">
        <label><input type="checkbox" checked id="toggle-Ceiling"> Ceiling</label>
        <label><input type="checkbox" checked id="toggle-Walls"> Walls</label>
        <label><input type="checkbox" checked id="toggle-Furniture"> Furniture</label>
        <label><input type="checkbox" checked id="toggle-Others"> Others</label>
    </div>
</div>

<div id="viewer-container">
    <model-viewer id="main-viewer" camera-controls shadow-intensity="1" src=""></model-viewer>
</div>

<script type="module">
    const mv = document.querySelector('#main-viewer');
    const primaryKeywords = ['Ceiling', 'Walls', 'Furniture'];

    // --- LOCAL LOAD LOGIC ---
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Create a local URL for the file on your computer
        const localUrl = URL.createObjectURL(file);
        
        // Load it into the viewer
        mv.src = localUrl;
    };

    // --- VISIBILITY LOGIC ---
    const updateVisibility = () => {
        const model = mv.model;
        if (!model) return;

        const states = {
            Ceiling: document.getElementById('toggle-Ceiling').checked,
            Walls: document.getElementById('toggle-Walls').checked,
            Furniture: document.getElementById('toggle-Furniture').checked,
            Others: document.getElementById('toggle-Others').checked
        };

        model.nodes.forEach(node => {
            let matched = false;
            
            // Check if node belongs to a primary group
            primaryKeywords.forEach(key => {
                if (node.name.toLowerCase().includes(key.toLowerCase())) {
                    node.visible = states[key];
                    matched = true;
                }
            });

            // "Others" handles anything not matching the keywords
            if (!matched) {
                node.visible = states.Others;
            }
        });
    };

    // Listen for checkbox changes
    ['Ceiling', 'Walls', 'Furniture', 'Others'].forEach(id => {
        document.getElementById(`toggle-${id}`).addEventListener('change', updateVisibility);
    });

    // Re-apply visibility when the model finishes loading
    mv.addEventListener('load', updateVisibility);
</script>

</body>
</html>
