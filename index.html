<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced 3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root { --primary: #007bff; --bg: #121212; --panel: #1e1e1e; --border: #333; }
        body { font-family: sans-serif; margin: 0; background: var(--bg); color: white; display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR PANEL */
        #sidebar { 
            width: 300px; background: var(--panel); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }

        #viewer-container { flex-grow: 1; position: relative; background: radial-gradient(#2c2c2c, #000); }
        model-viewer { width: 100%; height: 100%; }

        /* UI ELEMENTS */
        h3 { font-size: 14px; text-transform: uppercase; color: var(--primary); margin: 20px 0 10px; letter-spacing: 1px; }
        .control-item { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        
        .file-btn { 
            background: var(--primary); color: white; border: none; padding: 12px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px;
        }

        select, input[type="range"] { background: #333; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; width: 120px; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }

        /* GRID/HUD */
        .hud { position: absolute; bottom: 15px; left: 15px; font-size: 12px; color: #666; pointer-events: none; }
    </style>
</head>
<body>

<div id="sidebar">
    <input type="file" id="file-input" accept=".glb" style="display:none">
    <button class="file-btn" onclick="document.getElementById('file-input').click()">SELECT MODEL</button>
    
    <div id="status" style="font-size: 11px; color: #888; text-align: center;">No model loaded</div>

    <h3>Display</h3>
    <div class="control-item">Auto-Rotate <input type="checkbox" id="check-rotate"></div>
    <div class="control-item">Show Skybox <input type="checkbox" id="check-skybox"></div>
    
    <h3>Visibility Layers</h3>
    <div class="control-item">Ceiling <input type="checkbox" checked id="toggle-Ceiling"></div>
    <div class="control-item">Walls <input type="checkbox" checked id="toggle-Walls"></div>
    <div class="control-item">Furniture <input type="checkbox" checked id="toggle-Furniture"></div>
    <div class="control-item">Others <input type="checkbox" checked id="toggle-Others"></div>

    <h3>Lighting</h3>
    <div class="control-item">Exposure <input type="range" id="input-exposure" min="0" max="2" step="0.05" value="1"></div>
    <div class="control-item">Shadows <input type="range" id="input-shadow" min="0" max="2" step="0.05" value="1"></div>
    <div class="control-item">Environment
        <select id="select-env">
            <option value="neutral">Neutral</option>
            <option value="legacy">Legacy</option>
            <option value="soft">Soft</option>
        </select>
    </div>
</div>

<div id="viewer-container">
    <model-viewer 
        id="main-viewer" 
        camera-controls 
        shadow-intensity="1" 
        shadow-softness="1"
        exposure="1"
        src="">
    </model-viewer>
    <div class="hud" id="hud-stats">GLTF Viewer v2.0</div>
</div>

<script type="module">
    const mv = document.querySelector('#main-viewer');
    const keywords = ['Ceiling', 'Walls', 'Furniture'];

    // --- DISPLAY CONTROLS ---
    document.getElementById('check-rotate').addEventListener('change', (e) => {
        mv.autoRotate = e.target.checked;
    });

    document.getElementById('check-skybox').addEventListener('change', (e) => {
        // When skybox is on, the environment image becomes the background
        mv.style.backgroundColor = e.target.checked ? 'transparent' : '#121212';
        if (e.target.checked) mv.setAttribute('skybox-image', mv.getAttribute('environment-image'));
        else mv.removeAttribute('skybox-image');
    });

    // --- LIGHTING ---
    document.getElementById('input-exposure').addEventListener('input', (e) => mv.exposure = e.target.value);
    document.getElementById('input-shadow').addEventListener('input', (e) => mv.shadowIntensity = e.target.value);
    document.getElementById('select-env').addEventListener('change', (e) => {
        mv.environmentImage = e.target.value === 'neutral' ? '' : e.target.value;
    });

    // --- FILE LOADING ---
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            mv.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = file.name;
        }
    };

    // --- VISIBILITY ---
    const updateVisibility = () => {
        const model = mv.model;
        if (!model) return;
        const states = {
            Ceiling: document.getElementById('toggle-Ceiling').checked,
            Walls: document.getElementById('toggle-Walls').checked,
            Furniture: document.getElementById('toggle-Furniture').checked,
            Others: document.getElementById('toggle-Others').checked
        };

        model.nodes.forEach(node => {
            let matched = false;
            keywords.forEach(key => {
                if (node.name.toLowerCase().includes(key.toLowerCase())) {
                    node.visible = states[key];
                    matched = true;
                }
            });
            if (!matched) node.visible = states.Others;
        });
    };

    ['Ceiling', 'Walls', 'Furniture', 'Others'].forEach(id => {
        document.getElementById(`toggle-${id}`).addEventListener('change', updateVisibility);
    });

    mv.addEventListener('load', updateVisibility);
</script>

</body>
</html>
