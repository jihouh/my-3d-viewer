<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Professional Design Showcase</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    
    <style>
        :root { --primary: #007bff; --bg: #0a0a0a; --panel: #161616; --border: #333; }
        
        /* Force full screen on all devices */
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; }

        /* SIDEBAR - Fixed position for mobile/tablet stability */
        #sidebar { 
            width: 300px; height: 100%; background: var(--panel); border-right: 1px solid var(--border); 
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
            z-index: 2000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto; -webkit-overflow-scrolling: touch;
        }

        #viewer-container { 
            flex-grow: 1; height: 100%; position: relative; 
            background: radial-gradient(#2c2c2c, #000); z-index: 1; 
        }
        
        model-viewer { width: 100%; height: 100%; outline: none; }

        /* BREAKPOINTS */
        @media (max-width: 1024px) {
            #sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            #menu-trigger { display: block !important; }
        }

        /* UI ELEMENTS */
        #menu-trigger {
            display: none; position: absolute; top: 20px; left: 20px; z-index: 1005;
            background: var(--primary); color: white; border: none;
            padding: 12px 24px; border-radius: 4px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .close-btn { 
            display: none; background: #333; color: white; border: none; 
            padding: 12px; margin-bottom: 20px; border-radius: 4px; cursor: pointer; 
        }
        @media (max-width: 1024px) { .close-btn { display: block; } }

        .file-btn { 
            background: var(--primary); color: white; border: none; padding: 14px; 
            border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 20px;
        }

        .control-item { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        h3 { font-size: 11px; text-transform: uppercase; color: var(--primary); margin: 25px 0 10px; letter-spacing: 1px; }
        input[type="checkbox"] { width: 22px; height: 22px; cursor: pointer; }
        input[type="range"] { accent-color: var(--primary); width: 100px; }
    </style>
</head>
<body>

<button id="menu-trigger">☰ PROJECT MENU</button>

<div id="sidebar">
    <button class="close-btn" id="close-sidebar">✕ CLOSE MENU</button>
    
    <input type="file" id="file-input" accept=".glb" style="display:none">
    <button class="file-btn" onclick="document.getElementById('file-input').click()">OPEN MODEL</button>
    
    <div id="status" style="font-size: 11px; color: #666; text-align: center; margin-bottom: 15px;">Self-Service Viewer Active</div>

    <div class="control-item">Auto-Rotate <input type="checkbox" id="check-rotate"></div>

    <h3>Layers</h3>
    <div class="control-item">Ceiling <input type="checkbox" checked id="toggle-Ceiling"></div>
    <div class="control-item">Walls <input type="checkbox" checked id="toggle-Walls"></div>
    <div class="control-item">Furniture <input type="checkbox" checked id="toggle-Furniture"></div>
    <div class="control-item">Others <input type="checkbox" checked id="toggle-Others"></div>

    <h3>Ambiance</h3>
    <div class="control-item">Brightness <input type="range" id="input-exposure" min="0" max="2" step="0.1" value="1"></div>
    <div class="control-item">Shadows <input type="range" id="input-shadow" min="0" max="2" step="0.1" value="1"></div>

    <button class="file-btn" style="background:#222; margin-top:20px;" onclick="location.reload()">RESET VIEW</button>
</div>

<div id="viewer-container">
    <model-viewer id="main-viewer" camera-controls shadow-intensity="1" exposure="1" src=""></model-viewer>
</div>

<script>
    const mv = document.querySelector('#main-viewer');
    const sidebar = document.getElementById('sidebar');

    // Menu Controls
    document.getElementById('menu-trigger').onclick = () => sidebar.classList.add('open');
    document.getElementById('close-sidebar').onclick = () => sidebar.classList.remove('open');

    // Lighting
    document.getElementById('input-exposure').oninput = (e) => mv.exposure = e.target.value;
    document.getElementById('input-shadow').oninput = (e) => mv.shadowIntensity = e.target.value;
    document.getElementById('check-rotate').onchange = (e) => mv.autoRotate = e.target.checked;

    // File Selection
    document.getElementById('file-input').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
            mv.src = URL.createObjectURL(file);
            document.getElementById('status').innerText = "Loaded: " + file.name;
            if (window.innerWidth <= 1024) sidebar.classList.remove('open');
        }
    };

    // Layer Toggles
    const updateVisibility = () => {
        if (!mv.model) return;
        const keys = ['Ceiling', 'Walls', 'Furniture'];
        const states = {
            Ceiling: document.getElementById('toggle-Ceiling').checked,
            Walls: document.getElementById('toggle-Walls').checked,
            Furniture: document.getElementById('toggle-Furniture').checked,
            Others: document.getElementById('toggle-Others').checked
        };
        mv.model.nodes.forEach(node => {
            let matched = false;
            keys.forEach(k => { if (node.name.toLowerCase().includes(k.toLowerCase())) { node.visible = states[k]; matched = true; } });
            if (!matched) node.visible = states.Others;
        });
    };

    ['Ceiling', 'Walls', 'Furniture', 'Others'].forEach(id => {
        document.getElementById(`toggle-${id}`).onchange = updateVisibility;
    });

    mv.addEventListener('load', updateVisibility);
</script>

</body>
</html>
