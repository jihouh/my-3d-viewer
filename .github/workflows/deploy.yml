name: Inject Secrets and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to run this manually if needed

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated to v4 for Node 24 support

      - name: Inject Secrets
        run: |
          # Use a simpler replacement that is less prone to shell errors
          sed -i "s|PAYLOAD_PLACEHOLDER|${{ secrets.FIREBASE_CONFIG_JSON }}|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4 # Updated to v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
