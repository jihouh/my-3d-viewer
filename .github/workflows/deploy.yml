name: Inject Secrets and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Secrets with Node
        env:
          # This pulls your secret into a safe environment variable
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'index.html';
          let content = fs.readFileSync(path, 'utf8');
          // This replaces the placeholder string with the actual JSON object
          const updatedContent = content.replace('PAYLOAD_PLACEHOLDER', process.env.FIREBASE_CONFIG);
          fs.writeFileSync(path, updatedContent);
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
