name: Inject Secrets and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Secrets with Node
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG_JSON }}
        run: |
          node -e "
          const fs = require('fs');
          const path = 'index.html';
          let content = fs.readFileSync(path, 'utf8');
          // This removes the quotes around the placeholder and injects the JSON object
          const updatedContent = content.replace(/'PAYLOAD_PLACEHOLDER'/, process.env.FIREBASE_CONFIG);
          fs.writeFileSync(path, updatedContent);
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
