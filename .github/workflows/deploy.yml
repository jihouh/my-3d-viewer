name: Inject Secrets and Deploy
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Secrets
        run: |
          # This specifically targets the 'PAYLOAD_PLACEHOLDER' string inside quotes
          sed -i "s|'PAYLOAD_PLACEHOLDER'|${{ secrets.FIREBASE_CONFIG_JSON }}|g" index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
